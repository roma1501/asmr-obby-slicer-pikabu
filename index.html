<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Арена мечей: брызги красок</title>
    <link rel="icon" type="image/png" href="assets/ui/app_icon.png">
    <style>
        @font-face { font-family: 'PaintFont'; src: url('assets/fonts/montserrat.woff?v=0.1.9-d2dc7ee9') format('woff'); font-weight: 100 900; font-style: normal; font-display: swap; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1530;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        /* ViewCap.js: на ультрашироком десктопе поле 2:1 по центру, по бокам поля */
        html.vcap { background: #0e0b1c; }
        html.vcap body { width: var(--vcap-w); margin: 0 auto; position: relative; transform: translateZ(0); }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            background:
                url('assets/ui/loading_bg.webp?v=0.1.9-d2dc7ee9') center / cover no-repeat,
                radial-gradient(circle at 12% 18%, #ff3d7f 0 7%, transparent 7.4%),
                radial-gradient(circle at 18% 12%, #ff3d7f 0 2.4%, transparent 2.7%),
                radial-gradient(circle at 88% 80%, #2f9bff 0 9%, transparent 9.4%),
                radial-gradient(circle at 80% 90%, #2f9bff 0 2.6%, transparent 2.9%),
                radial-gradient(circle at 86% 16%, #ffd23f 0 5%, transparent 5.4%),
                radial-gradient(circle at 10% 84%, #2fd36b 0 6%, transparent 6.4%),
                radial-gradient(ellipse at center, #3a2470 0%, #1b1530 72%);
            z-index: 1000;
            font-family: 'PaintFont', 'Arial Black', system-ui, sans-serif;
        }
        .loading-text {
            font: 800 15px 'PaintFont', system-ui, sans-serif;
            color: #fff8ec;
            text-align: center;
            min-height: 1em;
            letter-spacing: 0.04em;
        }
        .loading-bar {
            width: min(300px, 72vw);
            height: 18px;
            background: #1b1530;
            border-radius: 10px;
            outline: 3px solid #fff8ec;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(115deg, #ff8a1f 0 10px, #ffb03a 10px 20px);
            border-radius: 10px;
            transition: width 0.3s ease;
            background-size: 40px 100%;
            animation: pb-load 0.7s linear infinite;
        }
        @keyframes pb-load { from { background-position: 0 0; } to { background-position: 40px 0; } }
        /* Герой экрана загрузки: блочный «Маляр» с мечом из CSS-блоков (до загрузки JS и 3D) */
        #loading-hero { position: relative; width: 150px; height: 190px; margin-bottom: 4px; animation: lh-bob 1.1s ease-in-out infinite; }
        #loading-hero i { position: absolute; display: block; border: 4px solid #1b1530; border-radius: 6px; box-sizing: border-box; }
        #loading-hero .h { left: 47px; top: 0; width: 56px; height: 52px; border-radius: 14px; background: #ffcfa6; z-index: 2; }
        #loading-hero .h::before, #loading-hero .h::after { content: ''; position: absolute; top: 15px; width: 7px; height: 12px; border-radius: 4px; background: #1b1530; }
        #loading-hero .h::before { left: 14px; } #loading-hero .h::after { right: 14px; }
        #loading-hero .m { left: 61px; top: 33px; width: 28px; height: 12px; border: 4px solid #1b1530; border-top: 0; border-radius: 0 0 14px 14px; z-index: 3; background: transparent; }
        #loading-hero .t { left: 37px; top: 50px; width: 76px; height: 66px; background: linear-gradient(#ff4f8b 0 70%, #ffd23f 70%); z-index: 1; }
        #loading-hero .al { left: 4px; top: 50px; width: 37px; height: 66px; background: #ffcfa6; transform-origin: 30px 6px; animation: lh-arm 1.1s ease-in-out infinite; }
        #loading-hero .ar { left: 109px; top: 50px; width: 37px; height: 66px; background: #ffcfa6; transform-origin: 6px 6px; transform: rotate(-112deg); animation: lh-swing 2.2s ease-in-out infinite; z-index: 3; }
        #loading-hero .ar b { position: absolute; left: 4px; top: 54px; width: 10px; height: 92px; transform-origin: 5px 4px; transform: rotate(180deg); }
        #loading-hero .ar b::before { content: ''; position: absolute; left: -2px; top: 0; width: 14px; height: 26px; background: #2c2440; border: 3px solid #1b1530; border-radius: 4px; box-sizing: border-box; }
        #loading-hero .ar b::after { content: ''; position: absolute; left: -8px; top: 24px; width: 26px; height: 74px; border: 3px solid #1b1530; box-sizing: border-box;
            background: linear-gradient(90deg, #bfe6ff, #e9f7ff 50%, #8fd3ff); clip-path: polygon(30% 0, 70% 0, 70% 82%, 50% 100%, 30% 82%); }
        #loading-hero .ll { left: 37px; top: 112px; width: 39px; height: 74px; background: linear-gradient(#5b2ea6 0 55%, #3d1f73 55%); }
        #loading-hero .lr { left: 74px; top: 112px; width: 39px; height: 74px; background: linear-gradient(#5b2ea6 0 55%, #3d1f73 55%); }
        #loading-hero .s1, #loading-hero .s2, #loading-hero .s3 { border: 0; border-radius: 50%; animation: lh-drop 1.6s ease-in infinite; }
        #loading-hero .s1 { left: 150px; top: 20px; width: 16px; height: 16px; background: #ffd23f; }
        #loading-hero .s2 { left: 162px; top: 50px; width: 11px; height: 11px; background: #2f9bff; animation-delay: .5s; }
        #loading-hero .s3 { left: 140px; top: 0; width: 13px; height: 13px; background: #2fd36b; animation-delay: 1s; }
        @keyframes lh-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes lh-arm { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-8deg); } }
        @keyframes lh-swing { 0%, 60%, 100% { transform: rotate(-112deg); } 72% { transform: rotate(-160deg); } 84% { transform: rotate(-40deg); } }
        @keyframes lh-drop { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(40px, 140px) scale(0.4); opacity: 0; } }
        @media (min-height: 600px) { #loading-hero { scale: 1.35; margin: 30px 0 40px; } }
        @media (max-height: 420px) { #loading-hero { scale: 0.7; margin: -30px 0 -40px; } }
        #loading-title { animation: pb-title 2.4s ease-in-out infinite; }
        @keyframes pb-title { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(-1deg) scale(1.04); } }
        #loading-title { margin: 0; font: italic 900 clamp(34px, 8vw, 72px)/1 'PaintFont', 'Arial Black', system-ui, sans-serif; color: #fff;
            text-align: center; max-width: 90vw; text-transform: uppercase; transform: rotate(-3deg);
            -webkit-text-stroke: 0.09em #1b1530; paint-order: stroke fill; text-shadow: 0 0.09em 0 #ff3d7f; }
        .engine-mark { display: none; }
        #loading-note { max-width: min(90vw, 560px); text-align: center; font: 800 clamp(12px, 2.6vmin, 16px)/1.3 'PaintFont', system-ui, sans-serif; color: #fff;
            opacity: 0.92; -webkit-text-stroke: 0.18em #1b1530; paint-order: stroke fill; }
        #loading-percent { font: italic 900 22px 'PaintFont', system-ui, sans-serif; color: #ffd23f; -webkit-text-stroke: 0.12em #1b1530; paint-order: stroke fill; }
        #loading-retry { padding: 12px 26px; border: 0; border-radius: 12px; background: #ff8a1f; color: #fff; font: italic 900 18px 'PaintFont', system-ui, sans-serif;
            cursor: pointer; outline: 3px solid #1b1530; box-shadow: 0 4px 0 #1b1530; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <div id="loading-hero" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="al"></i><i class="ll"></i><i class="lr"></i><i class="t"></i><i class="h"></i><i class="m"></i><i class="ar"><b></b></i></div>
        <h1 id="loading-title" data-t="title">Арена мечей: брызги красок</h1>
        <div id="loading-note" data-t="loading.note">Все персонажи — игрушечные куклы и роботы. Они не умирают, а разбираются на детали</div>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

<script src="js/Constants.js?v=0.1.9-d2dc7ee9"></script>

    <script src="js/main.js?v=0.1.9-d2dc7ee9"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
